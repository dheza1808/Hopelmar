<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <script>
  (() => {
    "use strict";
    const roles=["Sales / CS","Sales Support","Operasional","Admin Invoice + Pengadaan","Manager"];
    const menuByRole={
      "Sales / CS":[["Dashboard","dashboard"],["Quotation Baru","newQuotation"],["Daftar Quotation","quotations"],["Pelanggan","customers"],["Tugas Tambahan","salesTasks"],["Quotation Masuk","incoming"]],
      "Sales Support":[["Tugas Job Order","jobOrders"],["Biaya di Luar Penawaran","extraCosts"]],
      "Operasional":[["Pengiriman Laut","sea"],["Pengiriman Udara","air"],["Data Tagihan Udara","airBills"]],
      "Admin Invoice + Pengadaan":[["Tagihan","invoices"],["Petty Cash","pettyCash"],["Pengadaan","procurement"]],
      "Manager":[["Pemantauan Data","monitoring"]]
    };
    const stageLabel={quotation:"Quotation",waiting:"Menunggu kustomer",revision:"Revisi quotation",legal:"Cek legalitas PT",jobOrder:"Job Order",extraCost:"Biaya tambahan",sea:"Pengiriman Laut",air:"Pengiriman Udara",invoice:"Invoice",done:"Selesai"};
    const stageOwner={quotation:"Sales / CS",waiting:"Sales / CS",revision:"Sales / CS",legal:"Sales / CS",jobOrder:"Sales Support",extraCost:"Sales Support",sea:"Operasional",air:"Operasional",invoice:"Admin Invoice + Pengadaan",done:"Admin Invoice + Pengadaan"};
    const workStages=["quotation","waiting","revision","legal","jobOrder","extraCost","sea","air","invoice","done"];
    const customerNames=["Arunika Pangan Nusantara","Bumi Karya Elektrik","Cakrawala Tekstil Mandiri","Daya Prima Otomotif","Elang Timur Mineral","Fajar Medika Utama","Gemilang Furnitur Indonesia","Harapan Jaya Komponen","Indo Maritim Sejahtera","Jaya Abadi Kemasan","Kirana Alat Berat","Lentera Rasa Indonesia","Mitra Baja Persada","Nusa Karya Digital","Oceanic Parts Indonesia","Pilar Sukses Farmasi","Quanta Home Living","Rimba Sawit Makmur","Samudra Kaca Industri","Tirta Niaga Global","Utama Mesin Presisi","Vista Pangan Sejati","Wahana Plastik Sentosa","Yasa Tekno Mandiri","Zamrud Lautan Logistik","Aksara Kertas Perkasa","Bintang Perkasa Otomotif","Cipta Busana Global","Delta Sumber Energi","Eksakta Laboratorium"];
    const stageDistribution=["quotation","waiting","waiting","revision","legal","jobOrder","jobOrder","extraCost","extraCost","sea","sea","sea","air","air","air","invoice","invoice","invoice","done","done","done","done","done","done","done","quotation","jobOrder","sea","air","legal"];
    let state,activeRole=null,activePage="dashboard",detailId=null,modalSubmit=null,toastTimer,rememberedRole=null;
    const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
    const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const dateFormat=d=>{const x=new Date(d),date=new Intl.DateTimeFormat("id-ID",{day:"2-digit",month:"short",year:"numeric"}).format(x),time=new Intl.DateTimeFormat("id-ID",{hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(x);return `${date}, ${time}`};
    const dateInput=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
    const nowIso=()=>new Date().toISOString();
    function seedData(){
      const jobs=customerNames.map((customer,i)=>{
        const created=new Date();created.setDate(created.getDate()-(21-(i%21)));created.setHours(8+(i%9),[5,15,25,35,45,55][i%6],0,0);
        const stage=stageDistribution[i],type=i%3===0?"Reguler":"Insidental",route=i%2===0?"Laut":"Udara";
        const job={id:i+1,qn:`QN-${String(i+1).padStart(3,"0")}`,jobNumber:["jobOrder","extraCost","sea","air","invoice","done"].includes(stage)?`JO-${String(i+1).padStart(3,"0")}`:"",customer,route,type,stage,status:stage==="done"?"Selesai":stage==="revision"?"Perlu perbaikan":"Berjalan",createdAt:created.toISOString(),baseAmount:1800000+((i*437000)%8400000),customerType:i%4===0?"Baru":"Lama",extraCosts:[],history:[],invoiceCreated:false,docsChecked:false,repairNote:""};
        job.history.push({text:"Quotation dibuat oleh Sales / CS.",at:created.toISOString()});
        if(stage!=="quotation"){let flow=["quotation"];if(type==="Insidental")flow.push("waiting","legal");flow.push("jobOrder");if(stage==="extraCost")flow.push("extraCost");if(["sea","air","invoice","done"].includes(stage))flow.push(route==="Laut"?"sea":"air");if(["invoice","done"].includes(stage))flow.push("invoice");if(stage==="done")flow.push("done");for(let j=1;j<flow.length;j++){let t=new Date(created);t.setHours(t.getHours()+j*4);job.history.push({text:`Tahap ${stageLabel[flow[j]]} tercatat.`,at:t.toISOString()})}}
        if(stage==="extraCost"){job.extraCosts.push({description:"Biaya penanganan tambahan",amount:450000,at:new Date(created.getTime()+86400000).toISOString()})}
        if(["invoice","done"].includes(stage))job.invoiceCreated=true;
        return job;
      });
      const notifications=[];
      jobs.filter(j=>j.stage!=="done").forEach((j,i)=>notifications.push({id:`N-${j.id}`,role:stageOwner[j.stage],jobId:j.id,message:`${j.qn} — ${j.status==="Perlu perbaikan"?"Perlu ditindaklanjuti: "+stageLabel[j.stage]:`Menunggu tindakan pada tahap ${stageLabel[j.stage]}.`}`,at:new Date(new Date(j.createdAt).getTime()+((i%5)+1)*3600000).toISOString(),read:i%3===0}));
      const taskLabels=["Lengkapi dokumen legal customer baru","Hubungi customer untuk konfirmasi jadwal","Konfirmasi detail alamat pengiriman","Minta dokumen identitas perusahaan","Negosiasi jadwal keberangkatan","Periksa kelengkapan dokumen customer","Konfirmasi kebutuhan penanganan khusus"];
      const tasks=taskLabels.map((description,i)=>({id:i+1,description,at:new Date(Date.now()-(i+1)*86400000).toISOString(),kind:i%2?"Hubungi customer untuk konfirmasi atau negosiasi":"Input data dan dokumen legal customer baru"}));
      const pettyCash=["Parkir kendaraan operasional","Konsumsi koordinasi lapangan","Materai dokumen pengiriman","Biaya kurir dokumen","Perlengkapan kantor","Transportasi pengambilan dokumen","Biaya fotokopi berkas"].map((description,i)=>({id:i+1,description,amount:[85000,175000,12000,65000,210000,95000,38000][i],at:new Date(Date.now()-(i+2)*86400000).toISOString()}));
      const procurement=["Label dokumen pengiriman","Perlengkapan pengarsipan","Timbangan paket operasional","Tinta printer kantor","Peralatan keselamatan kerja"].map((description,i)=>({id:i+1,description,status:["Diajukan","Disetujui","Ditolak","Diajukan","Disetujui"][i],at:new Date(Date.now()-(i+1)*86400000).toISOString()}));
      return {jobs,notifications,tasks,pettyCash,procurement,nextId:31,nextTask:8,nextCash:8,nextProcurement:6};
    }
    function persist(){/* Demo data intentionally remains in memory only. */}
    function notify(role,job,message){state.notifications.unshift({id:`N-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,role,jobId:job?.id??null,message,at:nowIso(),read:false})}
    function log(job,text){job.history.unshift({text,at:nowIso()})}
    function getJob(id){return state.jobs.find(j=>j.id===Number(id))}
    function unreadCount(role){return state.notifications.filter(n=>n.role===role&&!n.read).length}
    function statusTag(job){const color=job.status==="Selesai"?"green":job.status==="Perlu perbaikan"?"red":job.stage==="waiting"?"amber":"blue";return `<span class="tag ${color}">${esc(job.status==="Selesai"?"Selesai":job.status==="Perlu perbaikan"?"Perlu perbaikan":stageLabel[job.stage])}</span>`}
    function routeTag(route){return `<span class="tag gray">${esc(route)}</span>`}
    function jobLink(job){return `<button class="job-link" data-action="detail" data-id="${job.id}">${esc(job.qn)}</button>`}
    function pageTitle(){if(detailId)return "Detail Job";for(const [label,key] of [...(menuByRole[activeRole]||[]),["Notifikasi","notifications"],["Arsip","archive"]])if(key===activePage)return label;return "Dashboard"}
    function navIcon(key){return ({dashboard:"▦",newQuotation:"＋",quotations:"▤",customers:"♧",salesTasks:"☷",incoming:"↙",jobOrders:"▣",extraCosts:"＋",sea:"▱",air:"✈",airBills:"▤",invoices:"▤",pettyCash:"＋",procurement:"▧",monitoring:"▥",notifications:"◉",archive:"▣",reset:"↻"})[key]||"•"}
    function renderLogin(){
      return `<main class="login-page"><section class="login-panel"><form class="login-card" id="login-form"><div class="login-brand"><img class="login-logo" src="./assets/hopelmar-logo.jpeg" alt="Hopelmar Logistics"></div><div class="login-access-notice"><span class="login-shield">✓</span><span><strong>KHUSUS AKUN INTERNAL</strong><small>Akses sistem dibatasi untuk role kantor yang telah ditentukan.</small></span></div><h2>AKUN KANTOR / ROLE</h2><div class="field"><label for="role-login">PILIH ROLE AKUN</label><select name="role" id="role-login" required><option value="" ${rememberedRole?"":"selected"} disabled>Pilih role kantor</option>${roles.map(role=>`<option value="${esc(role)}" ${rememberedRole===role?"selected":""}>${esc(role)}</option>`).join("")}</select></div><div class="login-format">Akun menggunakan nama role kantor, bukan nama orang.</div><h2>KUNCI AKSES / PASSCODE</h2><div class="field login-pass-wrap"><input id="passcode-login" type="password" autocomplete="off" placeholder="Passcode tidak diperlukan untuk demo" aria-label="Passcode demo"><button class="login-pass-toggle" type="button" data-action="toggle-pass" aria-label="Tampilkan passcode">Lihat</button></div><div class="login-options"><label class="login-remember"><input id="remember-role" type="checkbox" ${rememberedRole?"checked":""}> Ingat role di halaman ini</label><button class="login-forgot" type="button" data-action="forgot-access">Lupa akses?</button></div><button class="btn primary" type="submit">Masuk ke Job Tracker <span aria-hidden="true">→</span></button><div class="login-footer">PT HOPELMAR INTERNATIONAL</div></form></section></main>`;
    }
    function shell(){
      const menu=menuByRole[activeRole]||[];
      const navItems=menu.map(([label,key])=>`<button class="${activePage===key?"active":""}" data-action="navigate" data-page="${key}"><span class="nav-item-label"><span class="nav-icon" aria-hidden="true">${navIcon(key)}</span><span>${esc(label)}</span></span>${key==="incoming"&&state.jobs.filter(j=>j.stage==="waiting").length?`<span class="badge">${state.jobs.filter(j=>j.stage==="waiting").length}</span>`:""}</button>`).join("");
      const unread=unreadCount(activeRole);
      document.getElementById("app").innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark"><img src="./assets/hopelmar-symbol.jpeg" alt="Logo Hopelmar"></div><div><strong>PT Hopelmar International</strong><small>Freight Forwarding &amp; Logistics</small></div></div><div class="role-perspective"><span class="role-perspective-label">ACTIVE PERSPECTIVE</span><strong class="role-perspective-name">Role: ${esc(activeRole)}</strong><span class="role-perspective-control" aria-hidden="true">☷</span></div><div><div class="nav-label">MENU</div><nav class="nav">${navItems}</nav></div><div><div class="nav-label">UMUM</div><nav class="nav"><button class="${activePage==="notifications"?"active":""}" data-action="navigate" data-page="notifications"><span class="nav-item-label"><span class="nav-icon" aria-hidden="true">${navIcon("notifications")}</span><span>Notifikasi</span></span>${unread?`<span class="badge">${unread}</span>`:""}</button><button class="${activePage==="archive"?"active":""}" data-action="navigate" data-page="archive"><span class="nav-item-label"><span class="nav-icon" aria-hidden="true">${navIcon("archive")}</span><span>Arsip</span></span></button><button data-action="reset"><span class="nav-item-label"><span class="nav-icon" aria-hidden="true">${navIcon("reset")}</span><span>Reset data contoh</span></span></button></nav></div><div class="side-foot">Simulasi proses ekspedisi<br>Laut dan udara · Data tersimpan selama sesi</div></aside><main class="main"><header class="topbar"><div class="top-left"><button class="btn mobile-menu" data-action="menu">☰</button><div><div class="eyebrow">PT Hopelmar · ${esc(activeRole)}</div><div class="page-title">Job Tracker</div></div></div><div class="top-actions"><span class="session-role">${esc(activeRole)}</span><button class="btn logout-btn" data-action="logout">Keluar</button></div></header><section class="workspace" id="workspace">${detailId?renderDetail(getJob(detailId)):renderPage()}</section></main></div>`;
    }
    function pageHeader(title,description,actions=""){return `<div class="page-head"><div><h1>${title}</h1><p>${description}</p></div><div class="head-actions">${actions}</div></div>`}
    function stat(label,value,note){return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
    function jobTable(jobs,includeActions=true){
      if(!jobs.length)return `<div class="empty"><strong>Belum ada job pada daftar ini</strong>Job yang sesuai akan muncul di sini.</div>`;
      return `<div class="table-wrap"><table><thead><tr><th>No. Job</th><th>Customer</th><th>Jalur / Tipe</th><th>Tahap</th><th>Dibuat</th>${includeActions?"<th>Aksi</th>":""}</tr></thead><tbody>${jobs.map(j=>`<tr><td>${jobLink(j)}${j.jobNumber?`<div class="small muted">${esc(j.jobNumber)}</div>`:""}</td><td><strong>${esc(j.customer)}</strong></td><td>${routeTag(j.route)} <span class="tag gray">${esc(j.type)}</span></td><td>${statusTag(j)}</td><td>${dateFormat(j.createdAt)}</td>${includeActions?`<td><div class="actions">${actionButtons(j)}</div></td>`:""}</tr>`).join("")}</tbody></table></div>`;
    }
    function repairButton(job){if(job.stage==="done")return "";return `<button class="btn danger small-btn" data-action="repair" data-id="${job.id}">Kembalikan (ada kesalahan)</button>`}
    function actionButtons(j){
      const buttons=[];
      if(activeRole==="Sales / CS"){
        if(j.stage==="quotation")buttons.push(`<button class="btn primary small-btn" data-action="verify-quotation" data-id="${j.id}">Verifikasi & kirim quotation</button>`);
        if(j.stage==="revision")buttons.push(`<button class="btn primary small-btn" data-action="resend" data-id="${j.id}">Revisi & kirim ulang</button>`);
        if(j.stage==="legal")buttons.push(`<button class="btn primary small-btn" data-action="legal" data-id="${j.id}">Cek legalitas PT</button>`);
      }
      if(activeRole==="Sales Support"){
        if(j.stage==="jobOrder")buttons.push(`<button class="btn primary small-btn" data-action="issue-number" data-id="${j.id}">Terbitkan Job Number</button>`);
        if(j.stage==="extraCost")buttons.push(`<button class="btn primary small-btn" data-action="save-extra" data-id="${j.id}">Input biaya</button>`);
      }
      if(activeRole==="Operasional"&&["sea","air"].includes(j.stage))buttons.push(j.docsChecked?`<button class="btn success small-btn" data-action="complete-shipping" data-id="${j.id}">Selesaikan pekerjaan (Job Done)</button>`:`<button class="btn primary small-btn" data-action="check-docs" data-id="${j.id}">Cek dokumen dan Incoterm</button>`);
      if(activeRole==="Admin Invoice + Pengadaan"&&j.stage==="invoice")buttons.push(`<button class="btn primary small-btn" data-action="${j.invoiceCreated?"send-invoice":"create-invoice"}" data-id="${j.id}">${j.invoiceCreated?"Kirim invoice":"Buat invoice"}</button>`);
      if(j.stage!=="done"&&activeRole===stageOwner[j.stage])buttons.push(repairButton(j));
      buttons.unshift(`<button class="btn ghost small-btn" data-action="detail" data-id="${j.id}">Detail</button>`);
      return buttons.join("");
    }
    function renderPage(){
      switch(activePage){
        case "dashboard":return renderDashboard();
        case "newQuotation":return renderNewQuotation();
        case "quotations":return renderQuotations();
        case "customers":return renderCustomers();
        case "salesTasks":return renderTasks();
        case "incoming":return renderIncoming();
        case "jobOrders":return renderJobOrders();
        case "extraCosts":return renderExtraCosts();

    function move(job,newStage,message,notifyMessage){
      job.stage=newStage;job.status="Berjalan";job.repairNote="";log(job,message);notify(stageOwner[newStage],job,notifyMessage||`${job.qn} — ${message}`);persist();detailId=null;render();toast(message)

    function render(){shell();if(activePage==="notifications"){state.notifications.filter(n=>n.role===activeRole).forEach(n=>n.read=true);const badge=document.querySelector(".nav button[data-page='notifications'] .badge");if(badge)badge.remove();}}
    function showRepair(job){
      const previous={jobOrder:job.type==="Reguler"?"quotation":"legal",sea:"jobOrder",air:"jobOrder",extraCost:job.route==="Laut"?"sea":"air",invoice:job.route==="Laut"?"sea":"air"};
      const target=previous[job.stage];
